services:
  delta-constraint:
    build: .
    image: delta-constraint-enabler:latest
    container_name: delta-constraint-enabler
    ports:
      - "8000:8000"
    environment:
      # 内置样表目录（容器内路径）；网页只能操作该目录白名单中的表
      SAMPLE_ROOT: /srv/samples
    volumes:
      # 可写挂载：启用约束会在样表 _delta_log 下原子发布新的 JSON 提交
      - ./samples:/srv/samples
    restart: unless-stopped
